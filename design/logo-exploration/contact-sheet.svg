<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">GoalGuard logo exploration contact sheet</title>
  <desc id="desc">Four original GoalGuard combination-logo systems shown in navigation, app-icon, light, dark, and lime contexts.</desc>
  <defs>
