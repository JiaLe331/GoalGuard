<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1500" role="img" aria-labelledby="title desc">
  <title id="title">Pip application placement study</title>
  <desc id="desc">Pip appears selectively in GoalGuard navigation, landing, searching, recovery, confirmation, and demo-ready mockups.</desc>
  <defs>
    <g id="pip-head">
      <path d="M18 49C22 27 38 15 58 15c14 0 23 8 25 19-10 18-30 28-50 25-11-2-17-5-15-10Z" fill="#0B0C0A"/><path d="M13 78c2-21 17-34 37-36 14-1 24 6 27 17-8 20-27 32-48 31-11 0-17-3-16-12Z" fill="#0B0C0A"/><path d="M20 108c3-21 18-34 38-35 14-1 23 7 26 18-9 20-28 31-49 29-10-1-16-4-15-12Z" fill="#0B0C0A"/>
      <path d="M57 43c17-15 42-18 60-6 9 6 13 15 18 22 3 4 8 6 15 9 7 3 9 10 5 16-6 8-17 11-31 9-5 19-19 33-40 36-23 3-42-10-45-30-3-18 4-43 18-56Z" fill="#C9F52B"/><ellipse cx="105" cy="57" rx="10" ry="9" fill="#FFFFFF"/><circle cx="108" cy="59" r="4.5" fill="#0B0C0A"/><circle cx="110" cy="57" r="1.5" fill="#FFFFFF"/><path d="M96 45c7-3 14-2 19 2" fill="none" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="76" r="3.5" fill="#0B0C0A"/><path d="M124 83c6 4 12 4 18 0" fill="none" stroke="#0B0C0A" stroke-width="3" stroke-linecap="round"/><circle cx="43" cy="102" r="8" fill="#C9F52B" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <g id="micro"><path d="M9 17c2-8 9-12 17-11 6 1 9 5 8 9-5 7-13 10-21 8-4-1-5-3-4-6Z" fill="currentColor"/><path d="M7 30c1-8 7-13 15-13 6 0 9 3 9 8-4 8-11 12-19 11-4 0-6-2-5-6Z" fill="currentColor"/><path d="M10 43c2-8 8-12 16-12 6 0 9 4 9 8-4 8-12 11-20 10-4 0-6-2-5-6Z" fill="currentColor"/><path d="M24 18c8-8 20-9 29-3 4 3 6 7 8 10 1 2 4 3 7 4 5 2 6 7 3 10-3 4-9 5-14 4-3 8-10 13-19 14-11 1-20-6-21-15-1-8 2-18 7-24Z" fill="#C9F52B" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><circle cx="48" cy="25" r="3" fill="#0B0C0A"/><circle cx="23" cy="46" r="5" fill="#C9F52B" stroke="#FFFFFF" stroke-width="2.5"/></g>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B0C0A" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1600" height="1500" fill="#FFFFFF"/>
  <g font-family="Manrope, Inter, Segoe UI, sans-serif" fill="#0B0C0A">
    <text x="64" y="72" font-size="18" font-weight="800" letter-spacing="2.5">PIP · APPLICATION PLACEMENT STUDY</text>
    <text x="64" y="140" font-size="58" font-weight="750" letter-spacing="-3.5">Present where reassurance helps.</text>
    <text x="64" y="182" font-size="18" fill="#5D605A">Absent where exact financial data needs undivided attention.</text>

    <g transform="translate(64 225)" filter="url(#shadow)"><rect width="1472" height="82" rx="41" fill="#FFFFFF" stroke="#DFE1DC"/><g transform="translate(20 9) scale(.72)" color="#0B0C0A"><use href="#micro"/></g><text x="86" y="52" font-size="26" font-weight="750" letter-spacing="-1.2">GoalGuard</text><text x="610" y="50" font-size="14" font-weight="700">How it works</text><text x="742" y="50" font-size="14" font-weight="700">Trust &amp; safety</text><rect x="1152" y="19" width="118" height="44" rx="22" fill="#F2F3F0"/><text x="1211" y="47" text-anchor="middle" font-size="12" font-weight="750">Preview only</text><rect x="1284" y="12" width="170" height="58" rx="29" fill="#0B0C0A"/><text x="1369" y="48" text-anchor="middle" font-size="14" font-weight="750" fill="#FFFFFF">Start a goal</text></g>

    <g transform="translate(64 345)"><rect width="1472" height="448" rx="54" fill="#C9F52B"/><text x="54" y="68" font-size="13" font-weight="800" letter-spacing="1.7">GOAL-FIRST PROTECTION</text><text x="54" y="150" font-size="64" font-weight="750" letter-spacing="-4">Keep the reason</text><text x="54" y="214" font-size="64" font-weight="750" letter-spacing="-4">for the money visible.</text><text x="54" y="271" font-size="18">Pip helps explain the journey. You still inspect every limit and decide.</text><rect x="54" y="314" width="192" height="58" rx="29" fill="#0B0C0A"/><text x="150" y="350" text-anchor="middle" font-size="14" font-weight="750" fill="#FFFFFF">Create a protection goal</text>
      <g transform="translate(745 44)"><rect width="650" height="360" rx="36" fill="#FFFFFF"/><text x="34" y="44" font-size="12" font-weight="800" letter-spacing="1.4" fill="#666963">YOUR PROTECTION GOAL</text><text x="34" y="88" font-size="30" font-weight="750">What are you protecting?</text><rect x="34" y="116" width="582" height="116" rx="22" fill="#F2F3F0"/><text x="56" y="157" font-size="15" fill="#5D605A">I have $1,200 in ETH for rent next month…</text><rect x="34" y="252" width="582" height="64" rx="32" fill="#0B0C0A"/><text x="325" y="292" text-anchor="middle" font-size="15" font-weight="750" fill="#FFFFFF">Create protection goal</text></g>
      <g transform="translate(1190 190) scale(1.42)"><use href="#pip-head"/></g>
    </g>

    <g transform="translate(64 835)"><rect width="360" height="580" rx="48" fill="#0B0C0A"/><rect x="17" y="17" width="326" height="58" rx="29" fill="#FFFFFF"/><g transform="translate(29 14) scale(.58)" color="#0B0C0A"><use href="#micro"/></g><text x="82" y="53" font-size="18" font-weight="750">GoalGuard</text><circle cx="314" cy="46" r="5" fill="#0B0C0A"/><circle cx="297" cy="46" r="5" fill="#0B0C0A"/><text x="28" y="128" font-size="12" font-weight="800" letter-spacing="1.3" fill="#C9F52B">MOBILE COMPOSER</text><text x="28" y="180" font-size="38" font-weight="750" letter-spacing="-2.3" fill="#FFFFFF">Protect what</text><text x="28" y="222" font-size="38" font-weight="750" letter-spacing="-2.3" fill="#FFFFFF">comes next.</text><g transform="translate(170 218) scale(.9)"><use href="#pip-head"/></g><rect x="20" y="365" width="320" height="188" rx="30" fill="#FFFFFF"/><text x="42" y="405" font-size="18" font-weight="750">Your goal</text><rect x="42" y="426" width="276" height="52" rx="16" fill="#F2F3F0"/><text x="58" y="458" font-size="12" fill="#666963">Rent money in ETH…</text><rect x="42" y="492" width="276" height="42" rx="21" fill="#C9F52B"/><text x="180" y="519" text-anchor="middle" font-size="12" font-weight="750">Continue</text></g>

    <g transform="translate(464 835)"><rect width="500" height="270" rx="36" fill="#F2F3F0"/><text x="28" y="42" font-size="12" font-weight="800" letter-spacing="1.3" fill="#666963">LIVE OPTIONS · ACTIVE</text><text x="28" y="84" font-size="26" font-weight="750">Checking the available protection.</text><text x="28" y="116" font-size="14" fill="#5D605A">Pip appears only while the request is active.</text><g transform="translate(300 74) scale(1.02)"><use href="#pip-head"/><circle cx="15" cy="131" r="4" fill="#C9F52B"/><circle cx="31" cy="138" r="4" fill="#0B0C0A"/><circle cx="48" cy="134" r="4" fill="#C9F52B"/></g><rect x="28" y="205" width="180" height="12" rx="6" fill="#DFE1DC"/><rect x="28" y="205" width="92" height="12" rx="6" fill="#C9F52B"/><text x="28" y="244" font-size="12" fill="#666963">No fabricated percentage</text></g>
    <g transform="translate(984 835)"><rect width="552" height="270" rx="36" fill="#FFF1EF"/><text x="28" y="42" font-size="12" font-weight="800" letter-spacing="1.3" fill="#A93C35">SAFE STOP</text><text x="28" y="84" font-size="26" font-weight="750">No suitable live option was found.</text><text x="28" y="118" font-size="14" fill="#5D605A">Nothing moved. Edit the goal constraints and try again.</text><rect x="28" y="184" width="188" height="50" rx="25" fill="#0B0C0A"/><text x="122" y="215" text-anchor="middle" font-size="13" font-weight="750" fill="#FFFFFF">Edit goal constraints</text><g transform="translate(365 80) scale(.9)"><use href="#pip-head"/><circle cx="164" cy="125" r="17" fill="#FF7A72"/><path d="M164 115v12M164 134h.1" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/></g></g>

    <g transform="translate(464 1125)"><rect width="500" height="290" rx="36" fill="#FFFFFF" stroke="#DFE1DC"/><text x="28" y="42" font-size="12" font-weight="800" letter-spacing="1.3" fill="#666963">CONFIRM PREVIEW</text><text x="28" y="82" font-size="26" font-weight="750">Review exact cost and coverage.</text><text x="28" y="116" font-size="14" fill="#5D605A">Pip points to the decision boundary, not the figures.</text><g transform="translate(316 84) scale(.9)"><use href="#pip-head"/><rect x="149" y="108" width="30" height="38" rx="7" fill="#0B0C0A"/><circle cx="164" cy="127" r="6" fill="#C9F52B"/></g><rect x="28" y="190" width="444" height="58" rx="29" fill="#0B0C0A"/><text x="250" y="226" text-anchor="middle" font-size="14" font-weight="750" fill="#FFFFFF">Generate unsigned preview</text><text x="28" y="272" font-size="12" fill="#666963">No signing or broadcast action</text></g>
    <g transform="translate(984 1125)"><rect width="552" height="290" rx="36" fill="#0B0C0A"/><text x="28" y="42" font-size="12" font-weight="800" letter-spacing="1.3" fill="#C9F52B">DEMO READY</text><text x="28" y="82" font-size="27" font-weight="750" fill="#FFFFFF">Protection Plan Ready (Demo)</text><text x="28" y="116" font-size="14" fill="#C9CBC5">No funds moved; no protected position was created.</text><g transform="translate(375 79) scale(.9)"><use href="#pip-head"/><path d="M151 130h30" stroke="#C9F52B" stroke-width="5" stroke-linecap="round"/></g><rect x="28" y="190" width="228" height="58" rx="29" fill="#C9F52B"/><text x="142" y="226" text-anchor="middle" font-size="14" font-weight="750">Start another goal</text><text x="28" y="272" font-size="12" fill="#C9CBC5">Calm acknowledgement · never a success celebration</text></g>
  </g>
</svg>
