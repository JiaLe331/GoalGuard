    <text x="48" y="96" font-size="15" fill="#666963">Native output sizes — no optical variants or manual sharpening</text>
    <g transform="translate(48 132)"><rect width="1104" height="104" rx="24" fill="#F2F3F0"/><text x="24" y="40" font-size="17" font-weight="750">Purpose Orbit</text><g color="#0B0C0A"><g transform="translate(260 44) scale(.25)"><use href="#orbit"/></g><g transform="translate(350 40) scale(.375)"><use href="#orbit"/></g><g transform="translate(448 36) scale(.5)"><use href="#orbit"/></g><g transform="translate(554 28) scale(.75)"><use href="#orbit"/></g><g transform="translate(694 -12) scale(2)"><use href="#orbit"/></g></g><g transform="translate(898 12)" color="#FFFFFF"><rect width="182" height="80" rx="20" fill="#0B0C0A"/><g transform="translate(59 8)"><use href="#orbit"/></g></g></g>
    <g transform="translate(48 248)"><rect width="1104" height="104" rx="24" fill="#F2F3F0"/><text x="24" y="40" font-size="17" font-weight="750">Safe Passage</text><g color="#0B0C0A"><g transform="translate(260 44) scale(.25)"><use href="#passage"/></g><g transform="translate(350 40) scale(.375)"><use href="#passage"/></g><g transform="translate(448 36) scale(.5)"><use href="#passage"/></g><g transform="translate(554 28) scale(.75)"><use href="#passage"/></g><g transform="translate(694 -12) scale(2)"><use href="#passage"/></g></g><g transform="translate(898 12)" color="#FFFFFF"><rect width="182" height="80" rx="20" fill="#0B0C0A"/><g transform="translate(59 8)"><use href="#passage"/></g></g></g>
    <g transform="translate(48 364)"><rect width="1104" height="104" rx="24" fill="#F2F3F0"/><text x="24" y="40" font-size="17" font-weight="750">Dual Guard</text><g color="#0B0C0A"><g transform="translate(260 44) scale(.25)"><use href="#dual"/></g><g transform="translate(350 40) scale(.375)"><use href="#dual"/></g><g transform="translate(448 36) scale(.5)"><use href="#dual"/></g><g transform="translate(554 28) scale(.75)"><use href="#dual"/></g><g transform="translate(694 -12) scale(2)"><use href="#dual"/></g></g><g transform="translate(898 12)" color="#FFFFFF"><rect width="182" height="80" rx="20" fill="#0B0C0A"/><g transform="translate(59 8)"><use href="#dual"/></g></g></g>
    <g transform="translate(48 480)"><rect width="1104" height="104" rx="24" fill="#F2F3F0"/><text x="24" y="40" font-size="17" font-weight="750">Purpose Core</text><g color="#0B0C0A"><g transform="translate(260 44) scale(.25)"><use href="#core"/></g><g transform="translate(350 40) scale(.375)"><use href="#core"/></g><g transform="translate(448 36) scale(.5)"><use href="#core"/></g><g transform="translate(554 28) scale(.75)"><use href="#core"/></g><g transform="translate(694 -12) scale(2)"><use href="#core"/></g></g><g transform="translate(898 12)" color="#FFFFFF"><rect width="182" height="80" rx="20" fill="#0B0C0A"/><g transform="translate(59 8)"><use href="#core"/></g></g></g>
    <g transform="translate(48 596)"><rect width="1104" height="104" rx="24" fill="#F2F3F0"/><text x="24" y="40" font-size="17" font-weight="750">Pip micro-mark</text><g color="#0B0C0A"><g transform="translate(260 44) scale(.25)"><use href="#pip"/></g><g transform="translate(350 40) scale(.375)"><use href="#pip"/></g><g transform="translate(448 36) scale(.5)"><use href="#pip"/></g><g transform="translate(554 28) scale(.75)"><use href="#pip"/></g><g transform="translate(694 -12) scale(2)"><use href="#pip"/></g></g><g transform="translate(898 12)" color="#FFFFFF"><rect width="182" height="80" rx="20" fill="#0B0C0A"/><g transform="translate(59 8)"><use href="#pip"/></g></g></g>
    <g font-size="12" font-weight="750" fill="#666963" text-anchor="middle"><text x="316" y="122">16</text><text x="412" y="122">24</text><text x="496" y="122">32</text><text x="602" y="122">48</text><text x="790" y="122">128</text><text x="1037" y="122">REVERSED</text></g>
