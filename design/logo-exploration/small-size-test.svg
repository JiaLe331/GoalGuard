<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">GoalGuard logo small-size test</title>
  <desc id="desc">All five symbols shown at 16, 24, 32, 48, and 128 pixels on light and dark surfaces.</desc>
  <defs>
    <g id="orbit"><path d="M49 19A23 23 0 1 0 49 45H39" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><circle cx="32" cy="32" r="7" fill="#C9F52B"/></g>
    <g id="passage"><path d="M11 44h4c10 0 10-26 23-26h15" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><path d="M11 54h20c15 0 13-24 22-24" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><rect x="27" y="30" width="12" height="12" rx="4" fill="#C9F52B" transform="rotate(45 33 36)"/></g>
    <g id="dual"><path d="M28 8H18L6 20v24l12 12h10V43h-6l-5-5V26l5-5h6V8Z" fill="currentColor"/><path d="M36 8h10l12 12v24L46 56H36V43h6l5-5V26l-5-5h-6V8Z" fill="currentColor"/><rect x="28" y="24" width="8" height="16" rx="4" fill="#C9F52B"/></g>
    <g id="core"><rect x="7" y="8" width="24" height="14" rx="7" fill="currentColor"/><rect x="40" y="8" width="16" height="23" rx="8" fill="currentColor"/><rect x="7" y="35" width="15" height="21" rx="7.5" fill="currentColor"/><rect x="30" y="43" width="26" height="13" rx="6.5" fill="currentColor"/><rect x="25" y="25" width="16" height="16" rx="5" fill="#C9F52B" transform="rotate(-8 33 33)"/></g>
    <g id="pip"><path d="M9 17c2-8 9-12 17-11 6 1 9 5 8 9-5 7-13 10-21 8-4-1-5-3-4-6Z" fill="currentColor"/><path d="M7 30c1-8 7-13 15-13 6 0 9 3 9 8-4 8-11 12-19 11-4 0-6-2-5-6Z" fill="currentColor"/><path d="M10 43c2-8 8-12 16-12 6 0 9 4 9 8-4 8-12 11-20 10-4 0-6-2-5-6Z" fill="currentColor"/><path d="M24 18c8-8 20-9 29-3 4 3 6 7 8 10 1 2 4 3 7 4 5 2 6 7 3 10-3 4-9 5-14 4-3 8-10 13-19 14-11 1-20-6-21-15-1-8 2-18 7-24Z" fill="#C9F52B" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round"/><circle cx="48" cy="25" r="3" fill="#0B0C0A"/><circle cx="23" cy="46" r="5" fill="#C9F52B" stroke="#FFFFFF" stroke-width="2.5"/></g>
  </defs>
  <rect width="1200" height="740" fill="#FFFFFF"/>
  <g font-family="Manrope, Inter, Segoe UI, sans-serif" fill="#0B0C0A">
