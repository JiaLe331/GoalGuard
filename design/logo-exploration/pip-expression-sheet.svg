<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">Pip mascot expression and state sheet</title>
  <desc id="desc">Six restrained Pip poses for listening, checking, explaining, safe-stop, confirmation, and demo-ready states.</desc>
  <defs>
    <g id="pip-head">
      <path d="M18 49C22 27 38 15 58 15c14 0 23 8 25 19-10 18-30 28-50 25-11-2-17-5-15-10Z" fill="#0B0C0A"/><path d="M13 78c2-21 17-34 37-36 14-1 24 6 27 17-8 20-27 32-48 31-11 0-17-3-16-12Z" fill="#0B0C0A"/><path d="M20 108c3-21 18-34 38-35 14-1 23 7 26 18-9 20-28 31-49 29-10-1-16-4-15-12Z" fill="#0B0C0A"/>
      <path d="M57 43c17-15 42-18 60-6 9 6 13 15 18 22 3 4 8 6 15 9 7 3 9 10 5 16-6 8-17 11-31 9-5 19-19 33-40 36-23 3-42-10-45-30-3-18 4-43 18-56Z" fill="#C9F52B"/><ellipse cx="105" cy="57" rx="10" ry="9" fill="#FFFFFF"/><circle cx="108" cy="59" r="4.5" fill="#0B0C0A"/><circle cx="110" cy="57" r="1.5" fill="#FFFFFF"/><path d="M96 45c7-3 14-2 19 2" fill="none" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/><circle cx="145" cy="76" r="3.5" fill="#0B0C0A"/><path d="M124 83c6 4 12 4 18 0" fill="none" stroke="#0B0C0A" stroke-width="3" stroke-linecap="round"/><circle cx="43" cy="102" r="8" fill="#C9F52B" stroke="#FFFFFF" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1500" height="1050" fill="#FFFFFF"/>
  <g font-family="Manrope, Inter, Segoe UI, sans-serif" fill="#0B0C0A">
    <text x="64" y="78" font-size="18" font-weight="800" letter-spacing="2.4">PIP · CALM GUARDIAN</text>
    <text x="64" y="145" font-size="56" font-weight="750" letter-spacing="-3">Expression without financial theatre.</text>
    <text x="64" y="185" font-size="18" fill="#5D605A">Pip supports comprehension and recovery. Text—not expression or colour—always carries the state.</text>

    <g transform="translate(64 240)"><rect width="430" height="350" rx="34" fill="#F2F3F0"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><path d="M5 56c-9 7-9 19 0 26M-4 49c-16 12-16 29 0 41" fill="none" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/></g><text x="28" y="258" font-size="27" font-weight="750">Listening</text><text x="28" y="292" font-size="15" fill="#5D605A">“Tell me what this money is for.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2" fill="#666963">GOAL COMPOSER</text></g>
    <g transform="translate(535 240)"><rect width="430" height="350" rx="34" fill="#0B0C0A"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><circle cx="16" cy="131" r="4" fill="#C9F52B"/><circle cx="32" cy="139" r="4" fill="#FFFFFF"/><circle cx="49" cy="136" r="4" fill="#C9F52B"/></g><text x="28" y="258" font-size="27" font-weight="750" fill="#FFFFFF">Checking</text><text x="28" y="292" font-size="15" fill="#C9CBC5">“Reading live options and their limits.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2" fill="#C9F52B">ACTIVE REQUEST ONLY</text></g>
    <g transform="translate(1006 240)"><rect width="430" height="350" rx="34" fill="#C9F52B"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><path d="M149 112h30M149 123h23M149 134h16" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/></g><text x="28" y="258" font-size="27" font-weight="750">Explaining</text><text x="28" y="292" font-size="15">“Here is what each independent check found.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2">COUNCIL EDUCATION</text></g>

    <g transform="translate(64 630)"><rect width="430" height="350" rx="34" fill="#FFF1EF"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><circle cx="164" cy="125" r="17" fill="#FF7A72"/><path d="M164 115v12M164 134h.1" stroke="#0B0C0A" stroke-width="4" stroke-linecap="round"/></g><text x="28" y="258" font-size="27" font-weight="750">Safe stop</text><text x="28" y="292" font-size="15" fill="#5D605A">“Nothing moved. Review the constraint and try again.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2" fill="#A93C35">RECOVERABLE ERROR</text></g>
    <g transform="translate(535 630)"><rect width="430" height="350" rx="34" fill="#F2F3F0"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><rect x="149" y="108" width="30" height="38" rx="7" fill="#0B0C0A"/><circle cx="164" cy="127" r="6" fill="#C9F52B"/></g><text x="28" y="258" font-size="27" font-weight="750">Attentive</text><text x="28" y="292" font-size="15" fill="#5D605A">“Check every fact before generating the preview.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2" fill="#666963">PREVIEW CONFIRMATION</text></g>
    <g transform="translate(1006 630)"><rect width="430" height="350" rx="34" fill="#0B0C0A"/><g transform="translate(118 26) scale(1.18)"><use href="#pip-head"/><path d="M151 130h30" stroke="#C9F52B" stroke-width="5" stroke-linecap="round"/></g><text x="28" y="258" font-size="27" font-weight="750" fill="#FFFFFF">Ready, calmly</text><text x="28" y="292" font-size="15" fill="#C9CBC5">“The unsigned preview is ready to inspect.”</text><text x="28" y="322" font-size="12" font-weight="750" letter-spacing="1.2" fill="#C9F52B">NO CELEBRATION · NO FUNDS MOVED</text></g>
  </g>
</svg>
